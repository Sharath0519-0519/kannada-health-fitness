<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f766e">

<title>Kannada Health and Fitness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#e9eeed;--panel:#fff;--hd:#f4f7f6;--ink:#0f1f1d;--mute:#5d716e;--pri:#0f766e;--pri2:#0a5c56;--out:#0f766e;--in:#fff;--line:#e0e7e6;--wall:#f0f4f3;--blue:#0b64c0;--ic:#465c59;--sh:0 1px 2px #0f1f1d14,0 6px 18px #0f1f1d0f}
@media(prefers-color-scheme:dark){:root{--bg:#060c0b;--panel:#0d1514;--hd:#121c1b;--ink:#e8f0ee;--mute:#8aa09c;--pri:#0e8a7e;--pri2:#0b6f65;--out:#0d6b62;--in:#16221f;--line:#1d2b29;--wall:#0a1110;--blue:#7ab8ff;--ic:#a9bdb9;--sh:0 1px 2px #0006,0 6px 18px #0004}}
:root[data-theme=light]{--bg:#e9eeed;--panel:#fff;--hd:#f4f7f6;--ink:#0f1f1d;--mute:#5d716e;--pri:#0f766e;--pri2:#0a5c56;--out:#0f766e;--in:#fff;--line:#e0e7e6;--wall:#f0f4f3;--blue:#0b64c0;--ic:#465c59;--sh:0 1px 2px #0f1f1d14,0 6px 18px #0f1f1d0f}
:root[data-theme=dark]{--bg:#060c0b;--panel:#0d1514;--hd:#121c1b;--ink:#e8f0ee;--mute:#8aa09c;--pri:#0e8a7e;--pri2:#0b6f65;--out:#0d6b62;--in:#16221f;--line:#1d2b29;--wall:#0a1110;--blue:#7ab8ff;--ic:#a9bdb9;--sh:0 1px 2px #0006,0 6px 18px #0004}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans','Noto Sans Kannada',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:.5rem;border-radius:12px;line-height:1;transition:background .15s,transform .1s}
button:active{transform:scale(.96)}
svg{fill:currentColor;width:22px;height:22px;display:block}
button[data-ic],#f button,.dd,#rep button{display:inline-grid;place-items:center;color:var(--ic)}
button[data-ic]:hover,.dd:hover,#rep button:hover{background:var(--hd)}
.pb[data-ic]{color:#fff}.pb[data-ic]:hover{background:var(--pri2)}
#f #snd,#f #rs{color:#fff;padding:0;width:42px;height:42px;border-radius:50%}
#f #snd:hover,#f #rs:hover,.pb:hover{background:var(--pri2)}
#snd svg{width:21px;height:21px}#rs svg{width:20px}
.pb svg{width:20px;height:20px;margin:auto}
.dd svg{width:18px;height:18px}
.tk svg{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-left:3px}
#cc button{color:#fff}#cc button svg{width:26px;height:26px;margin:auto}#end svg{transform:rotate(135deg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.pb[data-ic],.pb{background:var(--pri);color:#fff;border-radius:12px;padding:.65rem 1.25rem;font-size:.95rem;font-weight:600}
input,select{border:1px solid var(--line);border-radius:12px;padding:.65rem .9rem;background:var(--hd);min-width:0}
select{padding:.55rem .7rem}
.mark{width:64px;height:64px;border-radius:20px;margin:0 auto 4px;display:grid;place-items:center;background:linear-gradient(150deg,#16a597,#0b4f4a);color:#fff;box-shadow:0 10px 24px #0f766e55}
.mark svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#login{width:min(380px,calc(100% - 32px));margin:12vh auto;padding:36px 28px;display:grid;gap:14px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh)}
#login h1{font-size:1.4rem;line-height:1.35;margin:0;font-weight:700}
#login .sub{margin:0 0 8px;color:var(--mute);font-size:.9rem}
#gbtn{justify-self:center;min-height:44px}
#login .lang{font-size:.95rem;color:var(--mute);border:1px solid var(--line);border-radius:12px;padding:.6rem}
#app{display:grid;grid-template-columns:minmax(300px,30%) 1fr;height:100dvh;max-width:1600px;margin:auto;background:var(--panel)}
aside,main{display:flex;flex-direction:column;min-height:0;min-width:0}
aside{border-right:1px solid var(--line)}
header{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-height:64px}
header .sp{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:.95rem;letter-spacing:.02em;position:relative;box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--line)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.mono{background:radial-gradient(circle at 28% 18%,#ffffff45,#fff0 58%),linear-gradient(150deg,hsl(var(--h) 42% 40%),hsl(calc(var(--h) + 30) 48% 22%))}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2.5px var(--panel)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px}
#side-t{padding:12px 16px 8px;display:grid;gap:10px}
#tabs{display:flex;gap:2px;background:var(--hd);padding:3px;border-radius:12px}
#tabs button{flex:1;border-radius:9px;font-size:.82rem;font-weight:500;padding:.4rem .8rem;color:var(--mute)}
#tabs .on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
#list{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;padding:11px 16px;cursor:pointer;width:100%;text-align:left;border-radius:0;position:relative}
.row:hover{background:var(--hd)}
.row.on{background:color-mix(in srgb,var(--pri) 9%,var(--panel))}
.row.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--pri)}
.row b{font-weight:600}
.row .t{flex:1;min-width:0;display:grid;gap:2px}
.row .l1,.row .l2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row small{color:var(--mute);white-space:nowrap;font-size:.75rem}
.row .pv{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.86rem}
.bd{background:var(--pri);color:#fff;border-radius:10px;min-width:20px;height:20px;line-height:20px;padding:0 6px;font-size:.72rem;font-weight:600;text-align:center}
#empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--mute);padding:24px;background:var(--wall)}
#empty .big{width:88px;height:88px;border-radius:28px;margin:0 auto 18px;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 12%,var(--panel));color:var(--pri)}
#empty .big svg{width:40px;height:40px}
#chat{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#back{display:none}
#ct{flex:1;min-width:0;display:grid;line-height:1.3}
#ct b{font-weight:600}#ct small{color:var(--mute);font-size:.8rem}#ct #cs.on{color:var(--pri)}
#ms{width:140px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:16px 8%;gap:4px;background-color:var(--wall);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.more{align-self:center;font-size:.8rem;color:var(--mute);border-radius:999px;background:var(--panel);border:1px solid var(--line);padding:.35rem .9rem}
.day{align-self:center;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-size:.75rem;font-weight:500;padding:3px 12px;border-radius:999px;margin:10px 0}
.m{position:relative;max-width:min(75%,540px);padding:7px 12px 5px;border-radius:16px 16px 16px 4px;background:var(--in);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--out);border-color:transparent;color:#fff;border-radius:16px 16px 4px 16px}
.m a{color:var(--blue)}.m.me a{color:#c9fff7}
.m .im{display:block;width:auto;height:auto;max-width:min(100%,320px);max-height:260px;min-width:120px;object-fit:cover;border-radius:12px;cursor:zoom-in;margin-bottom:3px;background:#0000001a}
.m.media{padding:4px 4px 5px}.m.media .cp{display:block;padding:2px 8px 0}.m.media .mt{margin-right:6px}.m.media .doc{min-width:240px}.m.media audio{width:240px;max-width:100%}
.m audio{max-width:240px;display:block}
.m .doc,.doc{display:flex;gap:10px;align-items:center;background:#0000000f;padding:8px;border-radius:12px;color:inherit;min-width:220px;max-width:100%;text-decoration:none}
.m a.doc{color:inherit}.m.me .doc{background:#0000002e}
.doc .fi{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.doc .fi svg{width:24px;height:24px}
.doc .ft{display:grid;min-width:0}.doc .ft b{font-weight:600;overflow-wrap:anywhere;font-size:.9rem}.doc .ft small{color:var(--mute)}.m.me .ft small{color:#ffffffbb}
#pvm .doc{background:var(--hd)}
.rq{border-left:3px solid var(--pri);background:#0000000f;border-radius:6px;padding:3px 8px;margin-bottom:4px;display:grid;font-size:.85rem}
.m.me .rq{background:#0000002e;border-left-color:#fff9}
.rq span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m.me .rq span{color:#ffffffc0}
.mt{float:right;margin:6px 0 0 10px;font-size:.68rem;color:var(--mute);white-space:nowrap}
.m.me .mt{color:#ffffffb8}.mt .rd{color:#2f80d0}.m.me .mt .rd{color:#8ff0e1}
.dd{position:absolute;top:2px;right:2px;display:none;background:inherit;border-radius:8px;padding:2px 6px}
.m.me .dd{color:#ffffffcc}.m.me .dd:hover{background:#0000002e}
.m:hover .dd{display:block}
@media(hover:none){.dd{display:block;opacity:.6}}
#rep{display:flex;align-items:center;gap:8px;background:var(--hd);padding:8px 14px;border-left:3px solid var(--pri)}
#rep div{flex:1;min-width:0;display:grid;font-size:.85rem}
#rep span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tray{background:var(--hd);border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;max-height:190px;overflow-y:auto}
#tray .it{display:grid;justify-items:center;gap:6px;width:76px;font-size:.75rem;color:var(--mute);border-radius:12px;padding:4px}
#tray .it .c{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px #0003}
#tray .it .c svg{width:26px;height:26px}
#tray .e{font-size:1.5rem;padding:4px}
#f{display:flex;gap:6px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
#msg{flex:1;border-radius:24px;padding:.7rem 1.1rem}
#snd{background:var(--pri);color:#fff}
#rb{display:none;flex:1;align-items:center;gap:10px}
#rb i{color:#e5484d;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
#rb span{flex:1}
#f.rec>:not(#rb){display:none}#f.rec #rb{display:flex}
.ov{position:fixed;inset:0;background:#040b0acc;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:5}
.box{background:var(--panel);width:min(420px,96vw);max-height:92dvh;border-radius:20px;border:1px solid var(--line);box-shadow:0 24px 60px #0006;display:flex;flex-direction:column;overflow:hidden}
.box header{font-weight:600}
#nl{overflow-y:auto;min-height:120px}
.pvb{padding:14px;display:grid;gap:10px}
.pvb .x{max-width:100%;max-height:50dvh;margin:auto;border-radius:12px}
#lb img,#lb video{max-width:96vw;max-height:94dvh;border-radius:8px}
#pop{position:fixed;z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px #0004;display:grid;min-width:180px;padding:5px 0}
#pop button{text-align:left;border-radius:8px;margin:0 5px;padding:.55rem .85rem;font-size:.92rem}
#pop button:hover{background:var(--hd)}
#shb input,#shb select{width:100%}
#shb>div>b{font-size:.82rem;font-weight:600;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0d1514ee;color:#fff;padding:9px 18px;border-radius:999px;z-index:9;font-size:.9rem;box-shadow:0 8px 24px #0005}
#call,#ring{position:fixed;inset:0;background:#05100ff0;display:grid;place-items:center;z-index:8;color:#fff}
#theirs{width:100%;height:100%;object-fit:cover;background:#000}
#mine{position:absolute;right:12px;top:12px;width:30%;max-width:160px;border-radius:16px;box-shadow:0 6px 20px #0008}
#cn2{position:absolute;top:18px;left:18px;font-size:1.1rem;font-weight:600;text-shadow:0 1px 4px #000}
#cc{position:absolute;bottom:28px;display:flex;gap:16px}
#cc button{width:58px;height:58px;background:#ffffff26;backdrop-filter:blur(8px);border-radius:50%}
#cc button:hover{background:#ffffff40}
#end,#cc #end:hover{background:#e5484d!important}
.aud #theirs,.aud #mine{opacity:0;position:absolute;width:1px;height:1px;pointer-events:none}
.aud #cn2{position:static;font-size:1.6rem}
#ring div{background:var(--panel);color:var(--ink);padding:24px;border-radius:20px;display:grid;gap:12px;text-align:center;box-shadow:0 24px 60px #0006}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:700px){#app{grid-template-columns:1fr}#app:not(.open) main,#app.open aside{display:none}#back{display:block}#log{padding:12px 10px}.m{max-width:86%}#ms{width:90px}#login{margin:8vh auto}}
</style>
</head>
<body>
<div id="login">
  <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg></div>
  <h1 data-t="title"></h1>
  <p class="sub" data-t="sub"></p>
  <div id="gbtn"></div>
  <p id="gerr" hidden>Google sign-in is not set up: set GOOGLE_CLIENT_ID on the server.</p>
  <button type="button" class="lang">ಕನ್ನಡ | English</button>
</div>

<div id="app" hidden>
  <aside>
    <header><span id="myav"></span><b class="sp" id="myn"></b>
      <button id="nc" data-t="newchat" data-ti data-ic="newchat"></button><button id="mn" data-ic="menu"></button><button class="lang" data-ic="globe" title="ಕನ್ನಡ | English"></button><button id="out" data-ti data-t="out" data-ic="logout"></button></header>
    <div id="side-t"><input id="q" type="search"><div id="tabs"><button class="on" data-f="all" data-t="all"></button><button data-f="unread" data-t="unread"></button></div></div>
    <div id="list"></div>
  </aside>
  <main>
    <div id="empty"><div><div class="big" data-ic="chat"></div><p data-t="pick"></p><button class="pb" id="nc2" data-t="newchat"></button></div></div>

      <header><button id="back" data-ic="back"></button><span id="cav"></span><div id="ct"><b id="cn"></b><small id="cs"></small></div>
        <input id="ms" type="search" hidden><button id="sb" data-ic="search"></button><button id="ac" data-ti data-t="acall" data-ic="phone"></button><button id="vc" data-ti data-t="call" data-ic="video"></button></header>
      <div id="log"></div>
      <div id="rep" hidden><div><b id="rn"></b><span id="rt"></span></div><button id="rx" data-ic="close"></button></div>
      <div id="tray" hidden></div>
      <form id="f">

        <input id="msg" autocomplete="off"><button id="snd" data-ic="mic"></button>
        <div id="rb"><button type="button" id="rc" data-ic="trash"></button><i>●</i><span id="rtm">0:00</span><button type="button" id="rs" class="pb" data-ic="send"></button></div>
      </form>
    </section>
  </main>
</div>

<div id="nm" class="ov" hidden><div class="box"><header><button id="nx" data-ic="back"></button><b data-t="newchat"></b></header>
  <div style="padding:8px 12px"><input id="ns" type="search" style="width:100%"></div><div id="nl"></div></div></div>
<div id="pv" class="ov" hidden><div class="box"><div class="pvb"><div id="pvm"></div><input id="cap"><div style="display:flex;justify-content:space-between"><button id="pc" data-ic="close" style="color:var(--ic)"></button><button id="ps" class="pb" data-ic="send"></button></div></div></div></div>
<div id="sh" class="ov" hidden><div class="box"><header><button id="shx" data-ic="back"></button><b id="sht"></b></header><div id="shb" style="overflow-y:auto;padding:8px 12px;display:grid;gap:10px;align-content:start"></div></div></div>
<div id="lk" class="ov" style="background:var(--bg);z-index:20" hidden><div class="box" style="padding:20px;gap:10px;text-align:center"><b id="lkt"></b><input id="lki" type="password" inputmode="numeric"><button class="pb" id="lkb"></button></div></div>
<div id="lb" class="ov" hidden></div>
<div id="pop" hidden></div>
<div id="toast" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script>

function signIn(auth) {
  socket.connect();

    if (r.error) { localStorage.removeItem('sess'); if (auth.credential) alert(t('err')); return; }
    me = r.id; localStorage.setItem('sess', r.session);
    info[me] = Object.assign(info[me] || {}, r.user || { id: me, name: r.name });
    Object.entries(r.kv || {}).forEach(([k, v]) => { try { localStorage[k] = JSON.stringify(v); } catch (e) {} });

    contacts = load('c:' + me, []); contacts.forEach((c) => (info[c.id] = Object.assign(c, info[c.id] || {})));

}

function send(extra, to) {
  if (!chat && !to) return;
  const p = Object.assign({ to: 'user:' + (to || chat), id: (crypto.randomUUID && crypto.randomUUID()) || Date.now() + '' + Math.random() }, extra);
  if (reply && !to) { p.replyTo = reply; reply = null; drawReply(); }
  if (!socket.connected) { const o = load('ob', []); o.push(p); save('ob', o); return toast(tt('Offline – will send when connected', 'ಆಫ್‌ಲೈನ್ – ಸಂಪರ್ಕ ಬಂದಾಗ ಕಳುಹಿಸಲಾಗುತ್ತದೆ')); }
  socket.emit('send', p);
}
function shrink(file) {
  return new Promise((ok, no) => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return ok(file);
    const u = URL.createObjectURL(file), i = new Image();
    i.onerror = () => { URL.revokeObjectURL(u); ok(file); };
    i.onload = () => {
      URL.revokeObjectURL(u);
      const k = Math.min(1, 1600 / Math.max(i.width, i.height)), c = document.createElement('canvas');
      c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      c.toBlob((b) => ok(b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.82);
    };
    i.src = u;
  });
}
function toData(file, cb) {
  if (file.size > MAX) return toast(t('big'));
  toast(tt('Uploading…', 'ಅಪ್‌ಲೋಡ್ ಆಗುತ್ತಿದೆ…'));
  ((file.type || '').startsWith('image/') ? shrink(file) : Promise.resolve(file))
    .then((f) => {
      const fd = new FormData(); fd.append('file', f, f.name || file.name || 'file');
      return fetch('/upload', { method: 'POST', body: fd, headers: { 'x-session': localStorage.getItem('sess') || '' } }).then((r) => r.json()).then((j) => {
        if (!j.key) throw new Error(j.error || 'upload');
        cb({ name: file.name || f.name || 'file', type: f.type || file.type || 'application/octet-stream', size: f.size, key: j.key });
      });
    })
    .catch(() => toast(tt('Upload failed. Try again.', 'ಅಪ್‌ಲೋಡ್ ವಿಫಲವಾಯಿತು. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.')));
}

let rec, chunks, rtimer, rcancel;
async function recStart() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(s); chunks = []; rcancel = false;
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = () => {
      s.getTracks().forEach((x) => x.stop()); clearInterval(rtimer); $('#f').classList.remove('rec');
      if (rcancel) return;
      const ty = rec.mimeType.split(';')[0], b = new File(chunks, 'voice-' + Date.now() + (ty.includes('mp4') ? '.m4a' : '.webm'), { type: ty });
      toData(b, (d) => send({ file: d }));
    };
    rec.start(); const t0 = Date.now(); $('#f').classList.add('rec');
    rtimer = setInterval(() => { const s2 = Math.floor((Date.now() - t0) / 1000); $('#rtm').textContent = Math.floor(s2 / 60) + ':' + String(s2 % 60).padStart(2, '0'); }, 500);

/* ---------- Calls (WebRTC): voice + video. Add a TURN server for strict networks. ---------- */
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let pc, local, peer, offer, queue2 = [], wantVideo = true;
const sig = (data) => socket.emit('call', { to: peer, data });
async function media(v) {
  local = await navigator.mediaDevices.getUserMedia({ video: v, audio: true });
  $('#mine').srcObject = local;
  pc = new RTCPeerConnection(ICE);
  local.getTracks().forEach((tr) => pc.addTrack(tr, local));
  pc.ontrack = (e) => ($('#theirs').srcObject = e.streams[0]);
  pc.onicecandidate = (e) => e.candidate && sig({ type: 'ice', candidate: e.candidate.toJSON() });
  $('#call').classList.toggle('aud', !v); $('#cm').hidden = !v; $('#cn2').textContent = nameOf(peer);
  setIc($('#mu'), 'mic'); setIc($('#cm'), 'video'); $('#call').hidden = false;
}
function hangup(notify) {
  if (notify && peer) sig({ type: 'end' });
  if (pc) pc.close();
  if (local) local.getTracks().forEach((tr) => tr.stop());
  pc = local = peer = offer = null; queue2 = [];
  $('#call').hidden = true; $('#ring').hidden = true;
}
async function startCall(v) {
  if (peer || !chat) return;
  peer = chat;
  try { await media(v); const o = await pc.createOffer(); await pc.setLocalDescription(o); sig({ type: 'offer', sdp: o, video: v }); }
  catch (err) { alert('Camera / microphone: ' + err.message); hangup(true); }
}
$('#vc').onclick = () => startCall(true); $('#ac').onclick = () => startCall(false);
$('#yes').onclick = async () => {
  $('#ring').hidden = true;
  try {
    await media(wantVideo); await pc.setRemoteDescription(offer);
    for (const c of queue2) await pc.addIceCandidate(c);
    queue2 = [];
    const a = await pc.createAnswer(); await pc.setLocalDescription(a); sig({ type: 'answer', sdp: a });
  } catch (err) { alert('Camera / microphone: ' + err.message); hangup(true); }
};
$('#no').onclick = $('#end').onclick = () => hangup(true);
$('#mu').onclick = () => { const a = local.getAudioTracks()[0]; a.enabled = !a.enabled; setIc($('#mu'), a.enabled ? 'mic' : 'micoff'); };
$('#cm').onclick = () => { const v = local.getVideoTracks()[0]; v.enabled = !v.enabled; setIc($('#cm'), v.enabled ? 'video' : 'videooff'); };
socket.on('call', async ({ from, data }) => {
  if (data.type === 'offer') {
    if (peer) return socket.emit('call', { to: from, data: { type: 'end' } });
    peer = from; offer = data.sdp; queue2 = []; wantVideo = data.video !== false;
    $('#who').textContent = (wantVideo ? '🎥 ' : '📞 ') + nameOf(from) + ' ' + t('incoming');
    $('#ring').hidden = false;
  } else if (from !== peer) return;
  else if (data.type === 'ice') { if (pc && pc.remoteDescription) await pc.addIceCandidate(data.candidate); else queue2.push(data.candidate); }
  else if (data.type === 'answer') await pc.setRemoteDescription(data.sdp);
  else if (data.type === 'end') hangup(false);
});

setInterval(() => {
  const r = load('rem', {}), L = load('rl', {}), n = new Date(), ping = (b) => (window.Notification && Notification.permission === 'granted' ? new Notification(b) : toast(b));
  if (r.wm && Date.now() - (L.w || 0) >= r.wm * 6e4) { L.w = Date.now(); ping(tt('Time to drink water', 'ನೀರು ಕುಡಿಯುವ ಸಮಯ')); }

function starredView() {

const fwd = (m) => sheet(tt('Forward to…', 'ಇವರಿಗೆ ಕಳುಹಿಸಿ…'), ...contacts.filter((c) => !blocked.has(c.id)).map((c) => row2(c.name || c.email, '', () => { send({ text: m.text || '', file: m.file }, c.id); $('#sh').hidden = true; toast('✓'); })));
function settings() {

  opts(ds, [[0, tt('Off', 'ಆಫ್')], [24, '24 h'], [168, '7 d']]); ds.value = localStorage.dis || 0; ds.onchange = () => { localStorage.dis = ds.value; drawLog(); };
  pn.type = 'password'; pn.inputMode = 'numeric'; pn.placeholder = tt('New PIN (empty = remove)', 'ಹೊಸ PIN (ಖಾಲಿ = ತೆಗೆಯಿರಿ)');

}
const lock = () => { $('#lkt').textContent = tt('Enter PIN', 'PIN ನಮೂದಿಸಿ'); $('#lkb').textContent = tt('Unlock', 'ತೆರೆಯಿರಿ'); $('#lki').value = ''; $('#lk').hidden = false; $('#lki').focus(); };
$('#lkb').onclick = () => { if ($('#lki').value === localStorage.pin) $('#lk').hidden = true; else { $('#lkt').textContent = tt('Wrong PIN', 'ತಪ್ಪು PIN'); $('#lki').value = ''; } };
